<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#2563eb"
    >

    <link
        rel="manifest"
        href="/manifest.json"
    >

    <title>NEXA AI</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #172033;
        }

        header {
            background: linear-gradient(
                135deg,
                #2563eb,
                #4f46e5
            );

            color: white;
            text-align: center;
            padding: 45px 20px 55px;
        }

        .logo {
            width: 70px;
            height: 70px;
            margin: 0 auto 15px;

            background: white;
            color: #2563eb;

            border-radius: 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 30px;
            font-weight: bold;
        }

        header h1 {
            margin: 0;
            font-size: 38px;
        }

        header p {
            margin-top: 10px;
            font-size: 17px;
        }

        .container {
            width: 92%;
            max-width: 800px;

            margin: -25px auto 40px;
        }

        .card {
            background: white;

            padding: 25px;

            border-radius: 20px;

            box-shadow:
                0 8px 30px rgba(0,0,0,0.08);
        }

        h2 {
            margin-top: 0;
        }

        .subtitle {
            color: #64748b;
            line-height: 1.6;
        }

        textarea {
            width: 100%;

            min-height: 140px;

            margin-top: 15px;

            padding: 16px;

            border: 2px solid #e2e8f0;

            border-radius: 14px;

            font-size: 16px;

            font-family: Arial, sans-serif;

            resize: vertical;

            outline: none;
        }

        textarea:focus {
            border-color: #2563eb;
        }

        #askButton {
            width: 100%;

            margin-top: 14px;

            padding: 16px;

            border: none;

            border-radius: 14px;

            background: #2563eb;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;
        }

        #askButton:disabled {
            background: #94a3b8;
        }

        .response {
            margin-top: 20px;

            padding: 20px;

            min-height: 120px;

            background: #f8fafc;

            border: 1px solid #e2e8f0;

            border-radius: 14px;

            line-height: 1.7;

            white-space: pre-wrap;

            overflow-wrap: break-word;
        }

        .examples {
            margin-top: 25px;
        }

        .example-btn {
            width: 100%;

            padding: 13px;

            margin-top: 8px;

            border: 1px solid #dbeafe;

            border-radius: 10px;

            background: #eff6ff;

            color: #2563eb;

            text-align: left;

            font-size: 14px;

            cursor: pointer;
        }

        .features {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 12px;

            margin-top: 20px;
        }

        .feature {
            background: white;

            padding: 18px;

            border-radius: 15px;

            text-align: center;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.05);
        }

        .feature-icon {
            font-size: 25px;
        }

        .feature strong {
            display: block;
            margin-top: 8px;
        }

        .about {
            margin-top: 20px;

            padding: 22px;

            background: white;

            border-radius: 18px;
        }

        .about p {
            color: #64748b;

            line-height: 1.7;
        }

        footer {
            text-align: center;

            padding: 25px;

            color: #64748b;

            font-size: 14px;
        }

        @media (max-width: 600px) {

            header h1 {
                font-size: 32px;
            }

            .features {
                grid-template-columns: 1fr;
            }

            .card {
                padding: 20px;
            }

        }

    </style>

</head>
