<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudyAI - AI Study Assistant</title>

    <meta
        name="description"
        content="StudyAI is an AI study assistant created by Oluwasemilore Adedokun and powered by Google's Gemini AI technology."
    >

    <meta
        name="author"
        content="Oluwasemilore Adedokun"
    >

    <meta name="theme-color" content="#2563eb">

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #111827;
        }

        header {
            background: #2563eb;
            color: white;
            padding: 25px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
        }

        header p {
            margin: 8px 0 0;
            font-size: 16px;
        }

        main {
            max-width: 750px;
            margin: 30px auto;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        h2 {
            margin-top: 0;
        }

        textarea {
            width: 100%;
            min-height: 140px;
            padding: 15px;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            font-size: 16px;
            resize: vertical;
            outline: none;
        }

        textarea:focus {
            border-color: #2563eb;
        }

        button {
            width: 100%;
            margin-top: 15px;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:active {
            transform: scale(0.98);
        }

        #response {
            display: none;
            margin-top: 20px;
            padding: 18px;
            background: #f0f4ff;
            border-radius: 12px;
            line-height: 1.6;
            word-wrap: break-word;
        }

        .examples {
            margin-top: 25px;
        }

        .examples p {
            margin: 8px 0;
            padding: 12px;
            background: #f3f4f6;
            border-radius: 8px;
            cursor: pointer;
        }

        .examples p:hover {
            background: #e5e7eb;
        }

        .about {
            margin-top: 30px;
            padding: 25px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .about h2 {
            color: #2563eb;
        }

        .about p {
            line-height: 1.7;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #6b7280;
            font-size: 14px;
        }
    </style>
</head>

<body>

<header>
    <h1>📚 StudyAI</h1>
    <p>Your personal AI study assistant</p>
</header>

<main>

    <div class="card">

        <h2>Study smarter 🚀</h2>

        <p>
            Ask StudyAI questions about your courses,
            assignments, calculations, or difficult topics.
        </p>

        <h3>🤖 Ask StudyAI</h3>

        <p>
            Enter your question below and StudyAI will
            help explain it.
        </p>

        <textarea
            id="question"
            placeholder="Example: What is economics?"
        ></textarea>

        <button onclick="askAI()">
            Ask StudyAI
        </button>

        <div id="response"></div>

        <div class="examples">

            <h3>💡 Try an example</h3>

            <p
