        * {

        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #172033;
        }

        header {
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            color: white;
            padding: 45px 20px 55px;
            text-align: center;
        }

        .logo {
            width: 72px;
            height: 72px;
            margin: 0 auto 15px;
            border-radius: 22px;
            background: white;
            color: #2563eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            font-weight: bold;
            box-shadow: 0 8px 25px rgba(0,0,0,0.18);
        }

        header h1 {
            margin: 0;
            font-size: 38px;
        }

        header p {
            margin: 10px 0 0;
            font-size: 17px;
            opacity: 0.95;
        }

        .container {
            width: 92%;
            max-width: 800px;
            margin: -25px auto 40px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        .card h2 {
            margin-top: 0;
            font-size: 24px;
        }

        .subtitle {
            color: #64748b;
            line-height: 1.6;
        }

        textarea {
            width: 100%;
            min-height: 140px;
            margin-top: 15px;
            padding: 16px;
            border: 2px solid #e2e8f0;
            border-radius: 14px;
            font-size: 16px;
            font-family: inherit;
            resize: vertical;
            outline: none;
        }

        textarea:focus {
            border-color: #2563eb;
        }

        #askButton {
            width: 100%;
            margin-top: 14px;
            padding: 16px;
            border: none;
            border-radius: 14px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        #askButton:hover {
            background: #1d4ed8;
        }

        #askButton:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .response {
            margin-top: 20px;
            padding: 20px;
            min-height: 120px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            white-space: pre-wrap;
            line-height: 1.7;
        }

        .examples {
            margin-top: 25px;
        }

        .examples h3 {
            margin-bottom: 12px;
        }

        .example-btn {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #dbeafe;
            border-radius: 10px;
            background: #eff6ff;
            color: #2563eb;
            text-align: left;
            cursor: pointer;
            font-size: 14px;
        }

        .example-btn:hover {
            background: #dbeafe;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 20px;
        }
